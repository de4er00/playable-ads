<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
    <title>Shadow Step</title>
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #1d1830; touch-action: none; user-select: none; -webkit-user-select: none; }
      canvas { display: block; }
      /* First frame before the script runs, so the ad never shows a white screen */
      #loader { position: fixed; inset: 0; display: grid; place-items: center; font: 900 34px "Arial Black", Arial, sans-serif; color: #fff; letter-spacing: 2px; text-shadow: 0 4px 0 #2a1a4b; }
      #loader::after { content: ""; position: fixed; left: 50%; top: 58%; width: 120px; height: 10px; margin-left: -60px; border-radius: 5px; background: linear-gradient(90deg, #e63946 0 40%, rgba(255,255,255,.15) 40%); background-size: 200% 100%; animation: load 0.9s linear infinite; }
      @keyframes load { from { background-position: 100% 0; } to { background-position: -100% 0; } }
    </style>
  </head>
  <body>
    <div id="loader">SHADOW STEP</div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
